<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #eee;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }
    h1 { font-size: 20px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #aaa; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #eee;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #7c3aed;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #mensagem { margin-top: 16px; font-size: 14px; text-align: center; }
    .sucesso { color: #4ade80; }
    .erro { color: #f87171; }

    table { width: 100%; margin-top: 32px; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2a2a2a; }
    th { color: #888; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cadastro de Clientes</h1>
    <form id="formCadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(19) 99999-9999">

      <button type="submit" id="btnEnviar">Cadastrar</button>
    </form>
    <p id="mensagem"></p>

    <table id="tabelaClientes" style="display:none">
      <thead>
        <tr><th>Nome</th><th>Email</th><th>Telefone</th></tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('formCadastro');
    const mensagem = document.getElementById('mensagem');
    const btnEnviar = document.getElementById('btnEnviar');
    const tabela = document.getElementById('tabelaClientes');
    const corpoTabela = document.getElementById('corpoTabela');

    // Se você hospedar essa página fora da Vercel, troque por
    // 'https://seu-projeto.vercel.app/api/clientes'
    const API_URL = '/api/clientes';

    async function carregarClientes() {
      try {
        const resp = await fetch(API_URL);
        const clientes = await resp.json();
        corpoTabela.innerHTML = '';
        clientes.forEach(c => {
          const linha = document.createElement('tr');
          linha.innerHTML = `<td>${c.nome}</td><td>${c.email}</td><td>${c.telefone || '-'}</td>`;
          corpoTabela.appendChild(linha);
        });
        tabela.style.display = clientes.length ? 'table' : 'none';
      } catch (e) {
        console.error('Não foi possível carregar clientes', e);
      }
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      btnEnviar.disabled = true;
      mensagem.textContent = '';
      mensagem.className = '';

      const dados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
      };

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados),
        });
        const resultado = await resp.json();

        if (!resp.ok) throw new Error(resultado.erro || 'Erro ao cadastrar.');

        mensagem.textContent = 'Cliente cadastrado com sucesso!';
        mensagem.className = 'sucesso';
        form.reset();
        carregarClientes();
      } catch (erro) {
        mensagem.textContent = erro.message;
        mensagem.className = 'erro';
      } finally {
        btnEnviar.disabled = false;
      }
    });

    carregarClientes();
  </script>
</body>
</html>
